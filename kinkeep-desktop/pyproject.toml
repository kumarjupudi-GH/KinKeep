[project]
name = "kinkeep-desktop"
version = "2.0.0"
description = "KinKeep: secure, offline-first family records"
requires-python = ">=3.10"
dependencies = ["cryptography>=44.0", "openpyxl>=3.1", "pywebview>=5.3", "keyring>=25.0"]

[project.scripts]
kinkeep = "kinkeep_desktop.app:main"

[tool.setuptools.packages.find]
include = ["kinkeep_desktop*"]

[tool.setuptools.package-data]
kinkeep_desktop = ["ui/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
